<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; font-family: "Microsoft YaHei", sans-serif; margin: 0; padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 10px; color: #fb7299; }
  p { font-size: 12px; color: #666; margin: 8px 0 0; line-height: 1.5; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 6px; background: #fb7299; color: #fff; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .6; }
</style>
</head>
<body>
  <h1>🎬 B站下载助手</h1>
  <button id="go">下载当前视频</button>

  <script src="popup.js"></script>
</body>
</html>
